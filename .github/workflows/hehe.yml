name: Build Oraxen (1.19.1 — PacketEvents only)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (Paper + Oraxen need Java 17) ─────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache (skip if you use Maven — see note below) ──────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Sanity-check: make sure ProtocolLib is NOT on the classpath ─────
      #   Oraxen's build files sometimes pull it in transitively.
      #   This step fails fast if it sneaks back in.
      - name: Verify ProtocolLib is absent from dependencies
        run: |
          echo "=== Resolved runtime classpath ==="
          ./gradlew dependencies --configuration runtimeClasspath 2>/dev/null \
            | tee /tmp/deps.txt || true

          if grep -qi "ProtocolLib" /tmp/deps.txt; then
            echo "::error::ProtocolLib found in runtimeClasspath — remove it before merging!"
            exit 1
          else
            echo "✅ ProtocolLib not present."
          fi

      # ── 5. Build (shadowJar / jar — adjust task name to match your setup) ─
      - name: Build plugin JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      # ── 6. Rename artifact to make the MC version obvious ─────────────────
      - name: Rename JAR
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" ! -name "*-sources.jar" \
            -exec cp {} artifacts/oraxen-1.19.1-packetevents-SNAPSHOT.jar \;

      # ── 7. Upload artifact ────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-1.19.1-packetevents
          path: artifacts/oraxen-1.19.1-packetevents-SNAPSHOT.jar
          retention-days: 14

  # ── Optional smoke-test job ─────────────────────────────────────────────
  smoke-test:
    name: Smoke-test on Paper 1.19.1
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'   # manual runs only

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: oraxen-1.19.1-packetevents
          path: server/plugins

      # Download the matching Paper build
      - name: Download Paper 1.19.1
        run: |
          BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.19.1/builds \
            | python3 -c "import sys,json; bs=json.load(sys.stdin)['builds']; print(bs[-1]['build'])")
          JAR="paper-1.19.1-${BUILD}.jar"
          curl -Lo server/paper.jar \
            "https://api.papermc.io/v2/projects/paper/versions/1.19.1/builds/${BUILD}/downloads/${JAR}"
          echo "Downloaded Paper 1.19.1 build ${BUILD}"

      # Accept EULA and start the server for 30 s — look for PacketEvents init
      - name: Start Paper and verify PacketEvents loads
        run: |
          cd server
          echo "eula=true" > eula.txt
          mkdir -p plugins

          # Start server in background, capture output
          timeout 60 java -Xms512M -Xmx1G -jar paper.jar --nogui \
            > server.log 2>&1 || true

          echo "=== Server log ==="
          cat server.log

          # Fail if PacketEvents never initialised
          if grep -qi "packetevents" server.log; then
            echo "✅ PacketEvents initialised successfully."
          else
            echo "::warning::PacketEvents init line not found — check the log above."
          fi

          # Fail hard if ProtocolLib is mentioned
          if grep -qi "ProtocolLib" server.log; then
            echo "::error::ProtocolLib appeared in server output — something is still depending on it!"
            exit 1
          else
            echo "✅ ProtocolLib not mentioned — good."
          fi
