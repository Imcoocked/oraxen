name: Build Oraxen v1.216.0 (PacketEvents only, MC 1.21.1)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Java (Paper 1.21.1 + Oraxen require Java 21) ───────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. Gradle cache ────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Apply thread-safety patch (NoteBlock deadlock fix) ──────────────
      # Root cause: PacketEventsBreakerSystem calls BreakerSystem.handleEvent()
      # on the Netty IO thread. NoteBlockMechanicListener.isTriggered() then
      # calls CraftBlock.getType() → ServerChunkCache.getChunk().join()
      # which waits for the server thread — deadlock when the server thread is
      # simultaneously blocked on a Netty channel write (player login).
      # Fix: dispatch handleEvent() to the main thread via Bukkit scheduler.
      - name: Apply thread-safety patch (NoteBlock BreakerSystem deadlock fix)
        run: |
          python3 - << 'PYEOF'
          import os, re, sys

          def find_file(name):
              for root, _, files in os.walk('.'):
                  if '.git' in root:
                      continue
                  for f in files:
                      if f == name:
                          return os.path.join(root, f)
              return None

          # ── Locate PacketEventsBreakerSystem.java ──────────────────────────
          path = find_file('PacketEventsBreakerSystem.java')
          if not path:
              print("ERROR: PacketEventsBreakerSystem.java not found")
              sys.exit(1)
          print(f"Found: {path}")

          with open(path) as fh:
              src = fh.read()

          # ── Guard: already patched? ────────────────────────────────────────
          if 'isPrimaryThread' in src:
              print("✅ Patch already applied — skipping.")
              sys.exit(0)

          # ── Add Bukkit import if missing ───────────────────────────────────
          if 'import org.bukkit.Bukkit;' not in src:
              src = re.sub(
                  r'^(import )',
                  'import org.bukkit.Bukkit;\n\\1',
                  src, count=1, flags=re.MULTILINE
              )

          # ── Wrap every handleEvent() call in a main-thread dispatch ─────────
          # Matches lines like:
          #   breakerSystem.handleEvent(a, b);
          #   BreakerSystem.handleEvent(a, b);
          pattern = re.compile(
              r'([ \t]+)((?:\w+\.)?handleEvent\([^;]+;)',
              re.MULTILINE
          )

          def make_dispatch(m):
              indent = m.group(1)
              call   = m.group(2)
              return (
                  f'{indent}if (Bukkit.isPrimaryThread()) {{\n'
                  f'{indent}    {call}\n'
                  f'{indent}}} else {{\n'
                  f'{indent}    Bukkit.getScheduler().runTask(\n'
                  f'{indent}        io.th0rgal.oraxen.OraxenPlugin.get(),\n'
                  f'{indent}        () -> {call}\n'
                  f'{indent}    );\n'
                  f'{indent}}}'
              )

          new_src, count = pattern.subn(make_dispatch, src)

          if count == 0:
              print("ERROR: handleEvent() pattern not found — check the file manually:")
              # Print lines around likely area for debugging
              for i, line in enumerate(src.splitlines()):
                  if 'handleEvent' in line or 'onPacketReceive' in line:
                      print(f"  line {i+1}: {line}")
              sys.exit(1)

          with open(path, 'w') as fh:
              fh.write(new_src)

          print(f"✅ Patched {count} handleEvent() call(s) in {path}")

          # ── Verify the patch looks correct ─────────────────────────────────
          print("\n── Patched method (context) ────────────────────────────────")
          for i, line in enumerate(new_src.splitlines()):
              if 'isPrimaryThread' in line or 'handleEvent' in line or 'runTask' in line:
                  print(f"  {i+1:4d}: {line}")
          PYEOF

      # ── 5. Sanity-check: ProtocolLib must NOT be on the classpath ──────────
      - name: Verify ProtocolLib is absent from dependencies
        run: |
          echo "=== Resolved runtime classpath ==="
          ./gradlew dependencies --configuration runtimeClasspath 2>/dev/null \
            | tee /tmp/deps.txt || true

          if grep -qi "ProtocolLib" /tmp/deps.txt; then
            echo "::error::ProtocolLib found in runtimeClasspath — remove it before merging!"
            exit 1
          else
            echo "✅ ProtocolLib not present."
          fi

      # ── 6. Build ───────────────────────────────────────────────────────────
      - name: Build plugin JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      # ── 7. Verify patch survived compilation ───────────────────────────────
      - name: Verify thread-safety patch is present in compiled JAR
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -1)
          if unzip -p "$JAR" '*PacketEventsBreakerSystem*' 2>/dev/null | strings | grep -q "isPrimaryThread"; then
            echo "✅ Thread-safety patch confirmed in compiled JAR."
          else
            echo "::warning::Could not confirm patch in JAR — check build output."
          fi

      # ── 8. Rename artifact ─────────────────────────────────────────────────
      - name: Rename JAR
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" ! -name "*-sources.jar" \
            -exec cp {} artifacts/oraxen-v1.216.0-polibuild.jar \;

      # ── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: oraxen-v1.216.0-polibuild
          path: artifacts/oraxen-v1.216.0-polibuild.jar
          retention-days: 14

  # ── Optional smoke-test job ──────────────────────────────────────────────
  smoke-test:
    name: Smoke-test on Paper 1.21.1
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'   # manual runs only

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download built JAR
        uses: actions/download-artifact@v5
        with:
          name: oraxen-v1.216.0-polibuild
          path: server/plugins

      - name: Download Paper 1.21.1
        run: |
          BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds \
            | python3 -c "import sys,json; bs=json.load(sys.stdin)['builds']; print(bs[-1]['build'])")
          JAR="paper-1.21.1-${BUILD}.jar"
          curl -Lo server/paper.jar \
            "https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds/${BUILD}/downloads/${JAR}"
          echo "Downloaded Paper 1.21.1 build ${BUILD}"

      - name: Start Paper and verify PacketEvents loads
        run: |
          cd server
          echo "eula=true" > eula.txt
          mkdir -p plugins

          timeout 60 java -Xms512M -Xmx1G -jar paper.jar --nogui \
            > server.log 2>&1 || true

          echo "=== Server log ==="
          cat server.log

          if grep -qi "packetevents" server.log; then
            echo "✅ PacketEvents initialised successfully."
          else
            echo "::warning::PacketEvents init line not found — check the log above."
          fi

          if grep -qi "ProtocolLib" server.log; then
            echo "::error::ProtocolLib appeared in server output!"
            exit 1
          else
            echo "✅ ProtocolLib not mentioned — good."
          fi
