name: Build Oraxen v1.193.1
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Oraxen v1.193.1
        uses: actions/checkout@v4
        with:
          repository: oraxen/oraxen
          ref: 1.193.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle (with retries)
        env:
          JITPACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            ./gradlew shadowJar --no-daemon \
              -PjitpackToken=$JITPACK_TOKEN && break
            echo "Build failed, waiting before retry..."
            sleep 30
          done

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-v1.193.1
          path: build/libs/*.jar
