name: Build Oraxen v1.193.1
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Oraxen v1.193.1
        uses: actions/checkout@v4
        with:
          repository: oraxen/oraxen
          ref: 1.193.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install WorldEdit into local Maven cache
        run: |
          curl -L -o worldedit.jar \
            "https://cdn.modrinth.com/data/1u6JkXh5/versions/Bu1zaaoc/worldedit-bukkit-7.3.9.jar?mr_download_reason=standalone"
          mvn install:install-file \
            -Dfile=worldedit.jar \
            -DgroupId=com.sk89q.worldedit \
            -DartifactId=worldedit-bukkit \
            -Dversion=7.4.0-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true
          mvn install:install-file \
            -Dfile=worldedit.jar \
            -DgroupId=com.sk89q.worldedit \
            -DartifactId=worldedit-core \
            -Dversion=7.4.0-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Patch build.gradle.kts to remove EngineHub repo
        run: |
          python3 - <<'EOF'
          import re
          with open('build.gradle.kts', 'r') as f:
              content = f.read()
          pattern = r'\s*maven\("https://maven\.enginehub\.org/repo/"\)\s*\{[^}]*\}'
          content = re.sub(pattern, '', content)
          with open('build.gradle.kts', 'w') as f:
              f.write(content)
          print("Done. Remaining enginehub references:")
          for i, line in enumerate(content.split('\n'), 1):
              if 'enginehub' in line:
                  print(f"  Line {i}: {line}")
          EOF

      - name: Build with Gradle (with retries)
        env:
          JITPACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            ./gradlew shadowJar --no-daemon \
              -PjitpackToken=$JITPACK_TOKEN && break
            echo "Build failed, waiting before retry..."
            sleep 30
          done

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-v1.193.1
          path: build/libs/*.jar
