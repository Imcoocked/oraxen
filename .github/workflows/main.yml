name: Build Oraxen v1.193.1
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Oraxen v1.193.1
        uses: actions/checkout@v4
        with:
          repository: oraxen/oraxen
          ref: 1.193.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install WorldEdit into local Maven cache
        run: |
          curl -L -o worldedit.jar \
            "https://cdn.modrinth.com/data/1u6JkXh5/versions/Bu1zaaoc/worldedit-bukkit-7.3.9.jar?mr_download_reason=standalone"
          mvn install:install-file \
            -Dfile=worldedit.jar \
            -DgroupId=com.sk89q.worldedit \
            -DartifactId=worldedit-bukkit \
            -Dversion=7.4.0-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true
          mvn install:install-file \
            -Dfile=worldedit.jar \
            -DgroupId=com.sk89q.worldedit \
            -DartifactId=worldedit-core \
            -Dversion=7.4.0-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Patch build.gradle.kts to remove EngineHub repo
        run: |
          python3 - <<'EOF'
          with open('build.gradle.kts', 'r') as f:
              lines = f.readlines()
          
          result = []
          skip = False
          depth = 0
          
          for line in lines:
              if not skip and 'maven.enginehub.org' in line:
                  skip = True
                  depth = line.count('{') - line.count('}')
                  continue
              
              if skip:
                  depth += line.count('{') - line.count('}')
                  if depth <= 0:
                      skip = False
                  continue
              
              result.append(line)
          
          with open('build.gradle.kts', 'w') as f:
              f.writelines(result)
          
          print("Done. Verifying:")
          for i, line in enumerate(result, 1):
              if 'enginehub' in line:
                  print(f"  Line {i}: {line.rstrip()}")
          print("No enginehub references remaining" if not any('enginehub' in l for l in result) else "")
          EOF

      - name: Build with Gradle (with retries)
        env:
          JITPACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            ./gradlew shadowJar --no-daemon \
              -PjitpackToken=$JITPACK_TOKEN && break
            echo "Build failed, waiting before retry..."
            sleep 30
          done

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-v1.193.1
          path: build/libs/*.jar
